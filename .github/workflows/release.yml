name: ProxFin Build
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Binaries
        run: |
          go mod tidy && go mod vendor
          
          # Build all binaries in parallel
          echo "Building all platforms in parallel"
          
          # Linux builds
          env GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/ProxFin_linux_arm64 &
          env GOOS=linux GOARCH=arm go build -ldflags="-s -w" -o dist/ProxFin_linux_arm &
          env GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/ProxFin_linux_amd64 &
          # Linux (amd64) build compatible with older glibc (e.g., Debian 11 / glibc 2.31)
          env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags netgo -ldflags="-s -w" -o dist/ProxFin_linux_amd64_glibc_2.31_compat &
          
          # FreeBSD builds
          env GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/ProxFin_freebsd_amd64 &
          env GOOS=freebsd GOARCH=arm go build -ldflags="-s -w" -o dist/ProxFin_freebsd_arm &
          
          # macOS builds
          env GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/ProxFin_darwin_arm64 &
          env GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/ProxFin_darwin_amd64 &
          
          # Windows build
          env GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/ProxFin_windows_amd64.exe &
          
          # Wait for all background jobs to finish
          wait
          
          # List all built binaries
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxfin-binaries
          path: dist/
          retention-days: 1

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Images go to GitHub Container Registry, which needs no extra secrets
      # (the workflow's own GITHUB_TOKEN is enough) and is linked to this
      # repository. The metadata action lowercases the image name, which
      # GHCR requires.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (standard)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Image tags (NVIDIA)
        id: meta-nvidia
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-nvidia
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      # Build the amd64 image once and keep it as a file so it can be
      # attached to the GitHub release too (for people who cannot or do not
      # want to use a registry: gunzip -c proxfin-docker-amd64.tar.gz | docker load).
      - name: Build amd64 image for the release download
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PROXFIN_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          load: true
          platforms: linux/amd64
          tags: proxfin:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name proxfin-test -p 34400:34400 proxfin:release
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:34400/web/; then
              echo "ProxFin answered on attempt $i"
              exit 0
            fi
            sleep 2
          done
          docker logs proxfin-test
          echo "ProxFin did not answer on :34400/web/" >&2
          exit 1

      - name: Save image as a release file
        run: |
          mkdir -p image
          docker save proxfin:release | gzip > image/proxfin-docker-amd64.tar.gz
          ls -lh image/

      - name: Upload image file
        uses: actions/upload-artifact@v4
        with:
          name: proxfin-docker-image
          path: image/
          retention-days: 1

      - name: Push multi-arch image (standard)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PROXFIN_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push multi-arch image (NVIDIA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            USE_NVIDIA=1
            PROXFIN_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-nvidia.outputs.tags }}
          labels: ${{ steps.meta-nvidia.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: proxfin-binaries
          path: dist

      - name: Download Docker image file
        uses: actions/download-artifact@v4
        with:
          name: proxfin-docker-image
          path: dist

      - name: Write release description
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > release-body.md <<EOF
          ## Docker

          \`\`\`bash
          docker pull ${image}:${GITHUB_REF_NAME}
          \`\`\`

          | Image | Platforms |
          |---|---|
          | \`${image}:${GITHUB_REF_NAME}\` (also \`:latest\`) | linux/amd64, linux/arm64, linux/arm/v7 |
          | \`${image}:${GITHUB_REF_NAME}-nvidia\` (also \`:latest-nvidia\`) | linux/amd64, linux/arm64, for NVIDIA hardware transcoding |

          No registry? Download \`proxfin-docker-amd64.tar.gz\` below and run
          \`gunzip -c proxfin-docker-amd64.tar.gz | docker load\`. That loads the image as \`proxfin:release\`.

          Run it with \`docker run -d -p 34400:34400 -v "\$(pwd)/data/conf:/home/proxfin/conf" ${image}:${GITHUB_REF_NAME}\`,
          then open \`http://<host>:34400/web/\`.

          ## Binaries

          Standalone builds for Linux, Windows, macOS and FreeBSD are attached below.
          EOF

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
