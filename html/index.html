<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Threadfin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css" type="text/css">
  <link rel="stylesheet" href="css/screen.css" type="text/css">
  <link rel="icon" href="img/threadfin.ico">
</head>

<body class="app" onload="javascript: PageReady();">

  <div id="loading" class="modal fade">
    <div class="modal-dialog loader"></div>
  </div>

  <div id="popup" class="modal fade">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header" id="popup_header"></div>
        <div class="modal-body">
          <div id="popup-custom"></div>
        </div>
        <div class="modal-footer" id="popup_footer"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="server_information">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">Server Information</h3>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <section class="info-section">
            <h4>Server</h4>
            <div class="info-grid">
              <div class="info-field">
                <label for="version">Threadfin version</label>
                <input type="text" id="version" readonly disabled>
              </div>
              <div class="info-field">
                <label for="branch">Branch</label>
                <input type="text" id="branch" readonly disabled>
              </div>
              <div class="info-field">
                <label for="errors">Errors</label>
                <input type="text" id="errors" readonly disabled>
              </div>
              <div class="info-field">
                <label for="warnings">Warnings</label>
                <input type="text" id="warnings" readonly disabled>
              </div>
            </div>
          </section>

          <section class="info-section">
            <h4>Streams</h4>
            <div class="info-grid">
              <div class="info-field">
                <label for="DVR">DVR IP</label>
                <input type="text" id="DVR" readonly disabled>
              </div>
              <div class="info-field">
                <label for="streams">Filtered channels</label>
                <input type="text" id="streams" readonly disabled>
              </div>
              <div class="info-field">
                <label for="xepg">Mapped channels</label>
                <input type="text" id="xepg" readonly disabled>
              </div>
            </div>
            <div class="info-field">
              <label for="m3u-url">M3U URL <span class="hint">Specific groups: http://…?group-title=foo,bar</span></label>
              <div class="copy-field">
                <input type="text" id="m3u-url" readonly>
                <button type="button" class="copy-btn" data-clipboard-target="#m3u-url" data-bs-title="Copy to clipboard" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="Copy M3U URL"><i class="far fa-clipboard"></i></button>
              </div>
            </div>
            <div class="info-field">
              <label for="xepg-url">XMLTV URL</label>
              <div class="copy-field">
                <input type="text" id="xepg-url" readonly>
                <button type="button" class="copy-btn" data-clipboard-target="#xepg-url" data-bs-title="Copy to clipboard" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="Copy XMLTV URL"><i class="far fa-clipboard"></i></button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <aside id="sidebar">
    <a class="sidebar-brand" href="/web" aria-label="Threadfin home">
      <span id="logo"></span>
    </a>
    <nav aria-label="Main">
      <ul id="main-menu"></ul>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="sidebar-link" data-bs-toggle="modal" data-bs-target="#server_information">
        <i class="fas fa-info-circle"></i><span>Server information</span>
      </button>
    </div>
  </aside>
  <div id="sidebar-backdrop" onclick="javascript: toggleNavigation();"></div>

  <div id="main">
    <header id="topbar">
      <button type="button" id="nav-toggle" onclick="javascript: toggleNavigation();" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>
      <div class="page-heading">
        <h1 id="page-title"></h1>
        <p id="page-subtitle"></p>
      </div>
      <div class="topbar-stats">
        <div id="playlist-connection-information" class="stat"></div>
        <div id="client-connection-information" class="stat"></div>
      </div>
    </header>

    <main id="page-content">
      <div id="content"></div>
      <div id="myStreamsBox" class="notVisible">
        <div class="stream-preview">
          <table id="activeStreams"></table>
        </div>
        <div class="stream-preview">
          <table id="inactiveStreams"></table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.10/clipboard.min.js"></script>
  <script language="javascript" type="text/javascript" src="js/network_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/menu_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/settings_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/logs_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/base_ts.js"></script>
</body>

</html>
