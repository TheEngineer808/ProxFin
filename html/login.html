<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>ProxFin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css" type="text/css">
  <link rel="stylesheet" href="css/screen.css" type="text/css">
  <link rel="icon" type="image/png" href="img/proxfin-icon.png">
</head>

<body class="auth">

  <div id="box">
    <div class="auth-brand" role="img" aria-label="ProxFin"></div>

    <div id="headline">
      <h1 id="head-text">{{.login.headline}}</h1>
    </div>

    <p id="err" class="errorMsg">{{.authenticationErr}}</p>

    <div id="content">
      <form id="authentication" method="post">
        <h5><label for="username">{{.login.username.title}}</label></h5>
        <input id="username" type="text" name="username" placeholder="Username" value="" autocomplete="username" autofocus>
        <h5><label for="password">{{.login.password.title}}</label></h5>
        <input id="password" type="password" name="password" placeholder="Password" value="" autocomplete="current-password">
        <input id="submit" type="submit" value="{{.button.login}}">
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.10/clipboard.min.js"></script>
  <script language="javascript" type="text/javascript" src="js/network_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/authentication_ts.js"></script>
</body>

</html>
