<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>ProxFin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css" type="text/css">
  <link rel="stylesheet" href="css/screen.css" type="text/css">
  <link rel="icon" type="image/png" href="img/proxfin-icon.png">
</head>

<body class="auth" onload="javascript: readyForConfiguration(0);">

  <div id="loading" class="modal fade">
    <div class="modal-dialog loader"></div>
  </div>

  <div id="popup" class="modal fade">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header" id="popup_header"></div>
        <div class="modal-body">
          <div id="popup-custom"></div>
        </div>
        <div class="modal-footer" id="popup_footer"></div>
      </div>
    </div>
  </div>

  <div id="box" class="wide">
    <div id="header" role="img" aria-label="ProxFin"></div>

    <div id="headline">
      <h1 id="head-text">Configuration</h1>
    </div>

    <p id="err" class="errorMsg"></p>

    <div id="content"></div>

    <div id="box-footer">
      <input id="next" type="button" name="next" value="Next" onclick="javascript: saveWizard();">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.10/clipboard.min.js"></script>
  <script language="javascript" type="text/javascript" src="js/configuration_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/network_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/menu_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/settings_ts.js"></script>
  <script language="javascript" type="text/javascript" src="js/base_ts.js"></script>
</body>

</html>
